name: ci

# Every job below delegates to a script in scripts/. That is deliberate: the
# local gate (scripts/local-ci.sh) runs this same file through `act`, and the
# per-platform builds run the same scripts, so a local pass and a CI pass
# cannot drift apart.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read-only by default. Only `release` publishes, so only `release` is
# granted contents: write — a build job compromised through a dependency
# cannot then write to the repository.
permissions:
  contents: read

env:
  # A GitHub runner ships needrestart, whose interactive "restart which
  # services?" prompt can hang an apt-get install until the job times out.
  # Set once here rather than per step: this was fixed in build-linux on
  # 2026-08-19 and the identical pattern in static-checks was missed, which
  # hung that job for 13 minutes until its timeout. Workflow scope means a
  # future apt step cannot reintroduce it.
  DEBIAN_FRONTEND: noninteractive
  NEEDRESTART_MODE: a

jobs:
  static-checks:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # Every tool this job runs, hash-locked (SNAT-0066). Edit
      # requirements-ci.in and run scripts/lock-requirements.sh to move one.
      - name: Install check tools
        run: python -m pip install --quiet --require-hashes -r requirements-ci.txt

      - name: Byte-compile every module
        run: python -m compileall -q snatch.py snatch scripts

      # F821 and friends are what actually catch the SNAT-0041 shape: a name
      # called inside a method with no import for it. compileall parses it and
      # the import check above imports the module fine -- the NameError only
      # fires when that widget is built. Measured 2026-09-02 by reproducing the
      # bug: both missed it, `ruff --select F821` found it.
      #
      # Deliberately NOT the whole F family. F401 fires on the tkinterdnd2
      # re-exports in __init__.py and F841 on the Tk app object that must stay
      # alive; both are adjudicated in .ants_review_falsepos.jsonl. This set is
      # green today, so the gate means something the day it lands.
      - name: Undefined names and syntax errors (ruff)
        run: ruff check --select F821,F811,F822,F823,E9 snatch.py snatch scripts

      - name: User-data permission pass (SNAT-0006)
        run: python scripts/verify_permissions.py

      # The suite imports version.py, downloader.py and tabs/history.py, all of
      # which import tkinter at module level, so this job needs python3-tk --
      # actions/setup-python does not bundle _tkinter. It drives no GUI.
      - name: Tests
        run: |
          scripts/apt-install.sh python3-tk
          python -m pytest

      - name: Shell lint
        run: |
          scripts/apt-install.sh shellcheck
          shellcheck scripts/*.sh

      # Every `uses:` is pinned to a commit SHA (SNAT-0070), and this step is
      # what keeps it so: .github/zizmor.yml requires hash pins for every
      # action, so a tag-pinned step added later fails here. --offline keeps
      # the audit deterministic and needs no token; the audits it skips are
      # the ones that query GitHub.
      - name: Workflow audit (zizmor)
        run: zizmor --offline --min-severity low .github/workflows

  build-linux:
    needs: static-checks
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          # No pip cache on a tag build. This workflow also runs on
          # pull_request, so a PR populates the same cache a later v* run
          # restores from -- and that run is the one whose artifacts are
          # attached to the Release. zizmor calls this cache-poisoning; the
          # cost of skipping it is one dependency download on release day.
          #
          # Written as `!startsWith(...) && 'pip' || ''`, not
          # `startsWith(...) && '' || 'pip'`. GitHub's A && B || C is only a
          # ternary while B is TRUTHY, and '' is not -- the second form
          # evaluates to 'pip' on BOTH branches and caches exactly as before.
          # zizmor's unsound-ternary audit is what caught it.
          #
          # The other two build jobs do the same, for the same reason
          # (SNAT-0047).
          cache: ${{ !startsWith(github.ref, 'refs/tags/v') && 'pip' || '' }}  # zizmor: ignore[cache-poisoning] -- off on tag builds, SNAT-0047

      - name: Install Tk runtime and X libraries
        run: |
          # libx* are runtime dependencies of tkinterdnd2's libtkdnd shared
          # object. Without them installed at build time PyInstaller cannot
          # resolve them, does not bundle them, and drag-and-drop fails on a
          # user machine that lacks them. Caught 2026-08-19 by running this
          # job locally under act, which logged:
          #   Library not found: could not resolve 'libXcursor.so.1'
          #
          # libfuse2 is deliberately NOT installed: build-linux.sh sets
          # APPIMAGE_EXTRACT_AND_RUN=1, so appimagetool unpacks itself instead
          # of mounting, and CI never executes the AppImage it produces.
          scripts/apt-install.sh \
            python3-tk tk-dev desktop-file-utils \
            libxcursor1 libxrandr2 libxinerama1 libxi6 libxss1

      # Hash-locked (SNAT-0066): a version pin takes whatever PyPI serves under
      # that version today, and --require-hashes refuses anything else. The
      # lock is requirements.txt plus PyInstaller; scripts/lock-requirements.sh
      # regenerates it. pip itself is the runner's, not upgraded from PyPI.
      - name: Install build dependencies
        run: python -m pip install --require-hashes -r requirements-build.txt

      # compileall proves each file PARSES; it never imports the package, so a
      # missing module or a bad `from X import Y` is invisible to it. This runs
      # here rather than in static-checks because snatch.app imports tkinter at
      # module level, and that job installs neither python3-tk nor the
      # requirements -- measured 2026-09-02, where it failed for exactly that.
      #
      # It does NOT catch a name used only inside a method; ruff F821 in
      # static-checks is what covers that shape.
      - name: Import every module (compileall does not import)
        run: python -c "import snatch, snatch.app, snatch.tabs.search, snatch.tabs.download, snatch.tabs.history, snatch.tabs.media_info, snatch.player, snatch.downloader, snatch.version"

      - name: Build AppImage
        run: scripts/build-linux.sh

      # Skipped under act (env.ACT), which has no artifact service — the
      # upload would always fail locally and mask the real build result.
      # On GitHub, ACT is unset, so this always runs.
      - name: Upload AppImage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !env.ACT }}
        with:
          name: snatch-linux
          path: dist/Snatch-*.AppImage
          retention-days: 30

  build-windows:
    needs: static-checks
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          # No pip cache on a tag build -- see build-linux (SNAT-0047).
          cache: ${{ !startsWith(github.ref, 'refs/tags/v') && 'pip' || '' }}  # zizmor: ignore[cache-poisoning] -- off on tag builds, SNAT-0047

      # Hash-locked, as in build-linux (SNAT-0066).
      - name: Install build dependencies
        run: python -m pip install --require-hashes -r requirements-build.txt

      - name: Build .exe
        shell: bash
        run: scripts/build-windows.sh

      # Skipped under act (env.ACT), which has no artifact service — the
      # upload would always fail locally and mask the real build result.
      # On GitHub, ACT is unset, so this always runs.
      - name: Upload .exe
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !env.ACT }}
        with:
          name: snatch-windows
          path: dist/snatch.exe
          retention-days: 30

  build-macos:
    needs: static-checks
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          # No pip cache on a tag build -- see build-linux (SNAT-0047).
          cache: ${{ !startsWith(github.ref, 'refs/tags/v') && 'pip' || '' }}  # zizmor: ignore[cache-poisoning] -- off on tag builds, SNAT-0047

      # Hash-locked, as in build-linux (SNAT-0066).
      - name: Install build dependencies
        run: python -m pip install --require-hashes -r requirements-build.txt

      - name: Build .app and .dmg
        run: scripts/build-macos.sh

      # Skipped under act (env.ACT), which has no artifact service — the
      # upload would always fail locally and mask the real build result.
      # On GitHub, ACT is unset, so this always runs.
      - name: Upload .dmg
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !env.ACT }}
        with:
          name: snatch-macos
          path: dist/Snatch-*.dmg
          retention-days: 30

  release:
    # Tag pushes only. Needs all three builds, so a release can never be cut
    # with a platform missing or broken.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-22.04
    permissions:
      contents: write  # the only job that publishes
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Download all build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: List what will be attached
        run: find artifacts -type f -print

      # Release notes come from the hand-written CHANGELOG section, not from
      # the commit log. Generating notes from commits describes what was done
      # to the code rather than what changed for the user, and it would
      # duplicate a changelog we already maintain.
      - name: Extract release notes for this tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { inside = 1; next }
            inside && /^## \[/        { exit }
            inside                     { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no '## [$version]' section — refusing to publish a release with no notes"
            exit 1
          fi
          echo "--- release notes ---"
          cat release-notes.md

      # SNAT-0036: one SHA256SUMS line per artefact, attached beside them, so
      # a download can be checked against what this job published. Hashed
      # from each file's own directory so the names in the file are bare,
      # which is what `sha256sum -c` matches against in a downloads folder.
      - name: Write SHA256SUMS
        run: |
          for f in artifacts/snatch-linux/Snatch-*.AppImage \
                   artifacts/snatch-windows/snatch.exe \
                   artifacts/snatch-macos/Snatch-*.dmg; do
            (cd "$(dirname "$f")" && sha256sum -- "$(basename "$f")")
          done > SHA256SUMS
          if [ "$(wc -l < SHA256SUMS)" -ne 3 ]; then
            echo "::error::expected 3 checksums, got $(wc -l < SHA256SUMS)"
            exit 1
          fi
          cat SHA256SUMS

      - name: Attach to GitHub Release
        # Pinned to the commit v2 pointed at on 2026-08-31 (v2.6.2). A tag is
        # mutable; this job is the one holding contents: write.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            artifacts/snatch-linux/Snatch-*.AppImage
            artifacts/snatch-windows/snatch.exe
            artifacts/snatch-macos/Snatch-*.dmg
            SHA256SUMS
          fail_on_unmatched_files: true
          body_path: release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

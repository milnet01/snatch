name: ci

# Every job below delegates to a script in scripts/. That is deliberate: the
# local gate (scripts/local-ci.sh) runs this same file through `act`, and the
# per-platform builds run the same scripts, so a local pass and a CI pass
# cannot drift apart.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  # A GitHub runner ships needrestart, whose interactive "restart which
  # services?" prompt can hang an apt-get install until the job times out.
  # Set once here rather than per step: this was fixed in build-linux on
  # 2026-08-19 and the identical pattern in static-checks was missed, which
  # hung that job for 13 minutes until its timeout. Workflow scope means a
  # future apt step cannot reintroduce it.
  DEBIAN_FRONTEND: noninteractive
  NEEDRESTART_MODE: a

jobs:
  static-checks:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Byte-compile every module
        run: python -m compileall -q snatch.py snatch scripts

      - name: Shell lint
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck scripts/*.sh

  build-linux:
    needs: static-checks
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Tk runtime and X libraries
        run: |
          sudo apt-get update -qq
          # libx* are runtime dependencies of tkinterdnd2's libtkdnd shared
          # object. Without them installed at build time PyInstaller cannot
          # resolve them, does not bundle them, and drag-and-drop fails on a
          # user machine that lacks them. Caught 2026-08-19 by running this
          # job locally under act, which logged:
          #   Library not found: could not resolve 'libXcursor.so.1'
          #
          # libfuse2 is deliberately NOT installed: build-linux.sh sets
          # APPIMAGE_EXTRACT_AND_RUN=1, so appimagetool unpacks itself instead
          # of mounting, and CI never executes the AppImage it produces.
          sudo apt-get install -y -qq --no-install-recommends \
            python3-tk tk-dev desktop-file-utils \
            libxcursor1 libxrandr2 libxinerama1 libxi6 libxss1

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.11.1

      - name: Build AppImage
        run: scripts/build-linux.sh

      # Skipped under act (env.ACT), which has no artifact service — the
      # upload would always fail locally and mask the real build result.
      # On GitHub, ACT is unset, so this always runs.
      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        if: ${{ !env.ACT }}
        with:
          name: snatch-linux
          path: dist/Snatch-*.AppImage
          retention-days: 30

  build-windows:
    needs: static-checks
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.11.1

      - name: Build .exe
        shell: bash
        run: scripts/build-windows.sh

      # Skipped under act (env.ACT), which has no artifact service — the
      # upload would always fail locally and mask the real build result.
      # On GitHub, ACT is unset, so this always runs.
      - name: Upload .exe
        uses: actions/upload-artifact@v4
        if: ${{ !env.ACT }}
        with:
          name: snatch-windows
          path: dist/snatch.exe
          retention-days: 30

  build-macos:
    needs: static-checks
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.11.1

      - name: Build .app and .dmg
        run: scripts/build-macos.sh

      # Skipped under act (env.ACT), which has no artifact service — the
      # upload would always fail locally and mask the real build result.
      # On GitHub, ACT is unset, so this always runs.
      - name: Upload .dmg
        uses: actions/upload-artifact@v4
        if: ${{ !env.ACT }}
        with:
          name: snatch-macos
          path: dist/Snatch-*.dmg
          retention-days: 30

  release:
    # Tag pushes only. Needs all three builds, so a release can never be cut
    # with a platform missing or broken.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List what will be attached
        run: find artifacts -type f -print

      # Release notes come from the hand-written CHANGELOG section, not from
      # the commit log. Generating notes from commits describes what was done
      # to the code rather than what changed for the user, and it would
      # duplicate a changelog we already maintain.
      - name: Extract release notes for this tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { inside = 1; next }
            inside && /^## \[/        { exit }
            inside                     { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no '## [$version]' section — refusing to publish a release with no notes"
            exit 1
          fi
          echo "--- release notes ---"
          cat release-notes.md

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/snatch-linux/Snatch-*.AppImage
            artifacts/snatch-windows/snatch.exe
            artifacts/snatch-macos/Snatch-*.dmg
          fail_on_unmatched_files: true
          body_path: release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
